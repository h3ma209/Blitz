# Cross-platform release builds for the Dioxus desktop app (wry/WebView).
name: Build and Release

on:
  push:
    branches: [main, master]
    tags: [v*]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Clippy Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and build
        uses: swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: cargo clippy
        run: cargo clippy --locked -- -D warnings

  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: Linux
            binary: blitz
            artifact: blitz-linux-x86_64
          - os: macos-latest
            label: macOS
            binary: blitz
            artifact: blitz-macos-arm64
          - os: windows-latest
            label: Windows
            binary: blitz.exe
            artifact: blitz-windows-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: swatinem/rust-cache@v2

      # wry (Dioxus desktop): GTK + WebKit; muda/tray-icon also link libxdo (Copy/Paste menu shortcuts).
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: cargo build --release
        run: cargo build --release --locked

      - name: cargo test
        run: cargo test --release --locked

      - name: Stage and archive (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.binary }}" "dist/${{ matrix.binary }}"
          tar -czf "dist/${{ matrix.artifact }}.tar.gz" -C dist "${{ matrix.binary }}"

      - name: Stage, package .app, and generate DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          make dmg
          cp target/Blitz.dmg "dist/Blitz-macos-arm64.dmg"
          cp "target/release/${{ matrix.binary }}" "dist/${{ matrix.binary }}"
          tar -czf "dist/${{ matrix.artifact }}.tar.gz" -C dist "${{ matrix.binary }}"

      - name: Stage and archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target\release\${{ matrix.binary }}" "dist\${{ matrix.binary }}"
          Compress-Archive -Path "dist\${{ matrix.binary }}" -DestinationPath "dist\${{ matrix.artifact }}.zip" -Force

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.tar.gz

      - name: Upload artifacts (macOS tar + dmg)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.tar.gz
            dist/Blitz-macos-arm64.dmg

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.zip

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: blitz-*
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            ### ⚡ Blitz Release ${{ github.ref_name }}

            #### 📦 Downloads
            - **macOS (Apple Silicon)**: `Blitz-macos-arm64.dmg` or `blitz-macos-arm64.tar.gz`
            - **Linux (x86_64)**: `blitz-linux-x86_64.tar.gz`
            - **Windows (x86_64)**: `blitz-windows-x86_64.zip`
            - **Checksums**: `SHA256SUMS`

            > **macOS Gatekeeper notice**: Blitz is open-source software without an Apple Developer paid notarization certificate. If macOS shows *"Blitz is damaged and can't be opened"*, remove the download quarantine flag in Terminal:
            > ```bash
            > xattr -cr /Applications/Blitz.app
            > ```
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
