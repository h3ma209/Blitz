[package]
name = "not_postman"
version = "0.1.0"
edition = "2021"
description = "Local-first API client (Rust + Dioxus) — Postman-inspired architecture"
license = "MIT"
readme = "README.md"

[dependencies]
dioxus = { version = "0.7.10", features = ["desktop"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "multipart", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
regex = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "process"] }
boa_engine = "0.20"
md-5 = "0.10"
hex = "0.4"
url = "2"
bytes = "1"
futures-util = "0.3"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
rumqttc = "0.24"
prost = "0.13"
prost-types = "0.13"
hyper = { version = "1", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1", "http2", "server"] }
http-body-util = "0.1"
http = "1"
tower = "0.5"
base64 = "0.22"
rfd = "0.15"
serde_yaml = "0.9"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
# Socket.IO client (protocol pane)
rust_socketio = { version = "0.6", default-features = false, features = ["async"] }
urlencoding = "2"

# macOS Keychain via Security.framework (keytar-equivalent). Other OS: in-memory fallback.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[profile.dev]
opt-level = 1

[profile.release]
lto = true
codegen-units = 1
